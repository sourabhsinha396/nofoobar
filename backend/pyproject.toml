[project]
name = "nofoobar-backend"
version = "0.1.0"
description = "Backend API for nofoobar - multi-tenant LMS"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "alembic>=1.14",
    "sqladmin>=0.20",
    "itsdangerous>=2.2",
    "pwdlib[argon2]>=0.2",
    "stripe>=15.1.0",
    "cryptography>=44",
    "razorpay>=1.4",
    "boto3>=1.43.14",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "polyfactory>=2.20",
    "httpx>=0.27",
    "moto>=5.2.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
